openapi: 3.1.0
info:
  title: API de consulta de movimientos
  version: 1.0.0
  description: API para consultar movimientos con políticas de seguridad y limitación de tasa.
paths:
  /movements:
    get:
      summary: Obtener movimientos
      operationId: getMovements
      security:
        - api_key: []
      responses:
        '200':
          description: Movimientos obtenidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementResponse'
components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: X-API-KEY
  schemas:
    MovementResponse:
      type: object
      properties:
        movements:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              amount:
                type: number
              date:
                type: string
                format: date-time